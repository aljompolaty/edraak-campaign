        el('td', {}, e.replacement_ar || '—'), el('td', { class: 'ltr' }, e.replacement_en || '—')));
    $('#dcWrap').replaceChildren(el('table', {},
      el('thead', {}, el('tr', {}, ['الرقم', 'اللهجة', 'الفئة', 'العربية', 'English / المعنى', 'البديل بالعربية', 'Replacement'].map(h => el('th', {}, h)))),
      el('tbody', {}, rows.length ? rows : el('tr', {}, el('td', { colspan: 7 }, 'لا نتائج')))));
  };
  const cats = [...new Set(D.dictionary.map(e => e.category))];
  const dias = [...new Set(D.dictionary.map(e => e.dialect || 'all'))];
  $('#panel-body').replaceChildren(
    el('p', { class: 'note' }, 'العبارات العامة تُطبَّق على كل النصوص العربية. عبارات اللهجات تُطبَّق فقط على النصوص بتلك اللهجة.'),
    el('div', { class: 'filters' },
      el('select', { 'aria-label': 'الفئة', onchange: e => { cat = e.target.value; dcBody(); } }, [['', 'كل الفئات'], ...cats.map(c => [c, c])].map(([v, l]) => el('option', { value: v }, l))),
      el('select', { 'aria-label': 'اللهجة', onchange: e => { dia = e.target.value; dcBody(); } }, [['', 'كل اللهجات'], ...dias.map(d => [d, dName(d)])].map(([v, l]) => el('option', { value: v }, l))),
      el('input', { type: 'search', placeholder: 'بحث بالعربية أو English', oninput: e => { state.dq = e.target.value; dcBody(); } })),
    el('div', { class: 'wrap', id: 'dcWrap' }));
  dcBody();
}
function renderCk() {
  const issues = D.issues.length
    ? el('div', { class: 'wrap' }, el('table', {},
        el('thead', {}, el('tr', {}, ['المعرف', 'المستوى', 'الرسالة'].map(h => el('th', {}, h)))),
        el('tbody', {}, D.issues.map(x => el('tr', {}, el('td', {}, x.id),
          el('td', { class: x.level === 'error' ? 'bad' : 'warnc' }, x.level === 'error' ? 'خطأ' : 'تحذير'), el('td', {}, x.message))))))
    : el('p', { class: 'ok' }, 'لا توجد ملاحظات على النصوص.');
  $('#panel-body').replaceChildren(
    el('h2', { style: 'font-size:18px;margin:4px 0 8px' }, 'نتائج الفحص'), issues,
    el('h2', { style: 'font-size:18px;margin:24px 0 8px' }, 'قائمة الفحص قبل التسليم'),
    ...D.checklist.flatMap(g => [el('h3', { style: 'font-size:15px;margin:14px 0 4px;color:var(--muted)' }, g.group),
      ...g.items.map(t => { const key = t; return el('label', { class: 'check' },
        el('input', { type: 'checkbox', checked: checked[key] ? 'checked' : null, onchange: e => { checked[key] = e.target.checked; } }), t); })]));
}
const RENDER = { tx: renderTx, ms: renderMs, vo: renderVo, dc: renderDc, ck: renderCk };
function renderPanel() {
  if (!$('#panel-body')) $('#panels').append(el('div', { id: 'panel-body' }));
  RENDER[current]();
}
$('#exportCsv').onclick = () => {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const head = ['المعرف', 'العنوان', 'اللغة', 'النمط', 'درجة قبل', 'درجة بعد', 'كليشيهات قبل', 'كليشيهات بعد', 'متوسط جملة قبل', 'متوسط جملة بعد'];
  const rows = D.items.map(i => [i.id, i.title, D.langs[i.language], i.voice_label, i.before.score, i.after.score,
    i.before.cliches, i.after.cliches, i.before.avg_sentence, i.after.avg_sentence].map(q).join(','));
  download(`${D.project.slug}-metrics.csv`, '\ufeff' + [head.map(q).join(','), ...rows].join('\n'), 'text/csv;charset=utf-8');
};
$('#exportMd').onclick = () => {
  const md = [`# ${D.project.name}`, ''];
  D.items.forEach(i => md.push(`## ${i.title} (${i.voice_label})`, '', i.rewritten, '', '---', ''));
  download(`${D.project.slug}-rewritten.md`, md.join('\n'), 'text/markdown;charset=utf-8');
};
renderHeader(); renderTabs(); renderPanel();
</script>
</body>
